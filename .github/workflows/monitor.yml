name: Monitor FactLens operations

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: factlens-operations-monitor
  cancel-in-progress: false

jobs:
  check:
    if: vars.FACTLENS_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      MONITOR_HOST: ${{ vars.FACTLENS_SSH_HOST }}
      MONITOR_USER: ${{ vars.FACTLENS_SSH_USER }}
      MONITOR_PORT: ${{ vars.FACTLENS_SSH_PORT || '22' }}
      MONITOR_KEY: ${{ secrets.FACTLENS_SSH_PRIVATE_KEY }}
      MONITOR_KNOWN_HOSTS: ${{ secrets.FACTLENS_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check service health, disk reserve and backup freshness
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$MONITOR_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$MONITOR_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$MONITOR_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$MONITOR_PORT >= 1 && 10#$MONITOR_PORT <= 65535 ))
          [[ -n "$MONITOR_KEY" && -n "$MONITOR_KNOWN_HOSTS" ]]
          key=$(mktemp)
          hosts=$(mktemp)
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$MONITOR_KEY" > "$key"
          printf '%s\n' "$MONITOR_KNOWN_HOSTS" > "$hosts"
          timeout 240 ssh -n -i "$key" -p "$MONITOR_PORT" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts" -o ConnectTimeout=10 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "$MONITOR_USER@$MONITOR_HOST" \
            'cd factlens && python3 devtools/operations.py check'
          curl --fail --silent --show-error --max-time 15 \
            https://factlens.pigs0516.com/api/health \
            | python3 -c 'import json,sys; assert json.load(sys.stdin).get("status")=="ready"'
      - name: Assume metadata-only offsite inspection role
        if: vars.FACTLENS_OFFSITE_ENABLED == 'true'
        uses: aws-actions/configure-aws-credentials@ff871ab82db5d1d904d5b2a74b710d951e730e8b
        with:
          role-to-assume: ${{ vars.FACTLENS_BACKUP_INSPECT_ROLE }}
          aws-region: ap-northeast-2
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Check offsite backup age without reading backup contents
        if: vars.FACTLENS_OFFSITE_ENABLED == 'true'
        env:
          BACKUP_BUCKET: ${{ vars.FACTLENS_BACKUP_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKUP_BUCKET" == factlens-backups-753805950222-ap-northeast-2 ]]
          OFFSITE_METADATA="$(aws s3api list-objects-v2 --bucket "$BACKUP_BUCKET" \
            --prefix daily/ --query Contents --output json --no-cli-pager)"
          export OFFSITE_METADATA
          python3 - <<'PY'
          from datetime import datetime, timedelta, timezone
          import json, os
          now = datetime.now(timezone.utc)
          def fresh(rows):
              return any(
                  row['Key'].endswith('.tar.gz') and 0 < row['Size'] <= 138412032
                  and timedelta(0) <= now - datetime.fromisoformat(row['LastModified'].replace('Z', '+00:00')) <= timedelta(hours=26)
                  for row in (rows or [])
              )
          def sample(hours, size=1):
              return [{'Key': 'daily/test.tar.gz', 'Size': size,
                       'LastModified': (now - timedelta(hours=hours)).isoformat()}]
          assert fresh(sample(0)) and fresh(sample(26))
          assert not any((fresh([]), fresh(sample(27)), fresh(sample(-1)), fresh(sample(0, 0))))
          if not fresh(json.loads(os.environ['OFFSITE_METADATA'])):
              raise SystemExit('OFFSITE_BACKUP_MISSING_OR_STALE')
          print('OFFSITE_FRESH')
          PY
