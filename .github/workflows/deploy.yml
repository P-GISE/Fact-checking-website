name: Verify and deploy FactLens

on:
  push:
    branches: [work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factlens-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: factlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: factlens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U factlens"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://factlens:ci-only-password@127.0.0.1:5432/factlens
      FACTLENS_SMOKE_TEST_DATABASE_URL: postgresql://factlens:ci-only-password@127.0.0.1:5432/factlens
      REDIS_URL: redis://127.0.0.1:6379
      FACTLENS_AI_MODE: disabled
      PYTHONPATH: apps/worker
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/worker/requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg tesseract-ocr
      - run: npm ci
      - run: python -m pip install -r apps/worker/requirements.txt
      - run: npm run typecheck && npm run build
      - run: npm test --workspace apps/api -- --no-file-parallelism
      - name: Prepare isolated recovery fixture
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker rename "$POSTGRES_CONTAINER" factlens-postgres-1
          docker exec factlens-postgres-1 createdb -U factlens -T factlens factlens_table_context_test
      - run: python -m pytest apps/worker/tests -q
      - run: bash devtools/test-deploy-production.sh

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/work' && vars.FACTLENS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://factlens.pigs0516.com
    env:
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ vars.FACTLENS_SSH_HOST }}
      DEPLOY_USER: ${{ vars.FACTLENS_SSH_USER }}
      DEPLOY_PORT: ${{ vars.FACTLENS_SSH_PORT || '22' }}
      DEPLOY_KEY: ${{ secrets.FACTLENS_SSH_PRIVATE_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.FACTLENS_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned SSH connection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          (( 10#$DEPLOY_PORT >= 1 && 10#$DEPLOY_PORT <= 65535 ))
          [[ -n "$DEPLOY_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/factlens-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/factlens-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/factlens-ssh/known_hosts"
      - name: Deploy verified commit
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$RUNNER_TEMP/factlens-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/factlens-ssh/known_hosts" \
            -o ConnectTimeout=15 -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd factlens && bash -s -- '$DEPLOY_SHA'" < devtools/deploy-production.sh \
            | tee "$RUNNER_TEMP/factlens-deploy.log"
          grep -Fx "Deployed $DEPLOY_SHA; loopback and public health are ready." "$RUNNER_TEMP/factlens-deploy.log" \
            || grep -Fx 'Stale deployment skipped: requested SHA is not origin/work HEAD.' "$RUNNER_TEMP/factlens-deploy.log"
      - name: Remove temporary SSH credentials
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/factlens-ssh/key" "$RUNNER_TEMP/factlens-ssh/known_hosts"
