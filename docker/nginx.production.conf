server {
  listen 8080;
  server_name factlens.pigs0516.com;
  # Only exposed on host loopback behind the trusted cloudflared process.
  # Cloudflare overwrites CF-Connecting-IP. Never expose this listener publicly.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header CF-Connecting-IP;
  client_max_body_size 101m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location /api/ {
    set $api_endpoint http://api:3000;
    proxy_pass $api_endpoint;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
