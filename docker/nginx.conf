server {
  listen 8080;
  server_name localhost;
  client_max_body_size 101m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
  root /usr/share/nginx/html;
  resolver 127.0.0.11 valid=5s ipv6=off;
  location /api/ {
    set $api_endpoint http://api:3000;
    proxy_pass $api_endpoint;
    proxy_set_header Host $http_host;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
