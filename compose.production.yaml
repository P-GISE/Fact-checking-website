# Standalone deployment behind the existing Cloudflare Tunnel.
name: factlens
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 192m
    environment:
      POSTGRES_USER: factlens
      POSTGRES_DB: factlens
      POSTGRES_PASSWORD: ${FACTLENS_DB_PASSWORD:?Run production-init.py first}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U factlens]
      interval: 5s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 96m
    command: redis-server --appendonly yes --maxmemory 48mb --maxmemory-policy noeviction
    volumes: [redisdata:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30
  media-init:
    image: alpine:3.21
    user: '0:0'
    command: sh -c 'mkdir -p /data/media && chown 1000:1000 /data/media && chmod 700 /data/media'
    volumes: [media:/data]
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      secrets: [proxy_ca]
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:size=32m,mode=1777']
    mem_limit: 256m
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://factlens:${FACTLENS_DB_PASSWORD:?required}@postgres:5432/factlens
      REDIS_URL: redis://redis:6379
      FACTLENS_LOCAL_ONLY: 'false'
      FACTLENS_AUTH_MODE: accounts
      FACTLENS_TRUST_PROXY: 'true'
      ALLOWED_ORIGINS: https://factlens.pigs0516.com
      NODE_EXTRA_CA_CERTS: /run/secrets/proxy_ca
      FACTLENS_ADMIN_TOKEN: ${FACTLENS_ADMIN_TOKEN:?required}
    secrets: [proxy_ca]
    volumes: [media:/data]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      media-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      secrets: [proxy_ca]
    restart: unless-stopped
    user: '1000:1000'
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    mem_limit: 768m
    cpus: 1
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      DATABASE_URL: postgresql://factlens:${FACTLENS_DB_PASSWORD:?required}@postgres:5432/factlens
      REDIS_URL: redis://redis:6379
      SSL_CERT_FILE: /run/secrets/proxy_ca
      FACTLENS_AI_MODE: ${FACTLENS_AI_MODE:-disabled}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      FACTLENS_JOB_BUDGET_MICROS: '200000'
      FACTLENS_MONTH_BUDGET_MICROS: '20000000'
      OMP_THREAD_LIMIT: '1'
    secrets: [proxy_ca]
    volumes: [media:/data]
    depends_on:
      api: {condition: service_healthy}
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NGINX_CONFIG: nginx.production.conf
      secrets: [proxy_ca]
    restart: unless-stopped
    ports: ['127.0.0.1:3300:8080']
    mem_limit: 64m
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      api: {condition: service_healthy}
secrets:
  proxy_ca:
    file: ${PROXY_CA_FILE:-/etc/ssl/certs/ca-certificates.crt}
volumes:
  media:
  pgdata:
  redisdata:
