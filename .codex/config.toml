# Project-local MCP servers. Restart Codex and trust this project to discover them.
[mcp_servers.codegraph]
command = "bash"
args = ["devtools/run.sh", "codegraph", "serve", "--mcp"]

[mcp_servers.iron_laws]
command = "bash"
args = ["devtools/run.sh", "iron-laws", "mcp", "--root", "."]

[mcp_servers.headroom]
command = "bash"
args = ["devtools/run.sh", "headroom", "mcp", "serve"]
